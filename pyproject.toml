[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arf"
version = "0.2.1"
description = "An fzf Pacman wrapper and AUR helper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "pyalpm",
    "srcinfo",
]

[project.scripts]
arf = "arf.cli:main"

[tool.setuptools.package-data]
"arf" = ["previews/*.sh"]

[tool.black]
line-length = 100
